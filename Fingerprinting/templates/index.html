<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Fingerprinting Lab</title>
  <style>
    body { font: 16px/1.5 Arial, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 18px; color: #222; }
    h1 { margin-bottom: 0; }
    section { border-top: 1px solid #ccc; margin-top: 28px; padding-top: 12px; }
    input { width: 100%; box-sizing: border-box; padding: 9px; font: inherit; }
    button { margin-top: 10px; padding: 7px 14px; font: inherit; }
    li { margin: 3px 0; }
    #target-sentence { font-weight: bold; }
    #typing-result, #fingerprint-output { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Browser Fingerprinting Lab</h1>
  <p>Local experiment: this page shows what the browser exposes without cookies.</p>

  <section>
    <h2>Active browser features</h2>
    <ul id="feature-output"><li>Waiting for JavaScript...</li></ul>
    <p><strong>SHA-256 fingerprint:</strong> <span id="fingerprint-output">Calculating...</span></p>
  </section>

  <section>
    <h2>Typing rhythm</h2>
    <p>Type this sentence exactly:</p>
    <p id="target-sentence">Cookies are gone, but Alice’s rhythm still leaves traces!</p>
    <input id="typing-input" type="text" aria-label="Type the target sentence" autocomplete="off" spellcheck="false">
    <button id="restart-button" type="button">Restart</button>
    <p id="typing-result" aria-live="polite"></p>
  </section>

  <script src="{{ url_for('static', filename='fingerprint.js') }}"></script>
  <script src="{{ url_for('static', filename='fingerprint2.js') }}"></script>
</body>
</html>
